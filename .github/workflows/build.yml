name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Builds only read the repository; the release job asks for write access itself
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis,msi
          - os: ubuntu-22.04
            bundles: deb,appimage,rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node tools/release-notes.mjs --check "${GITHUB_REF_NAME#v}"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Type-check UI
        run: npm run check

      - name: Golden tests (byte-exact against rivalcfg)
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Regenerate third-party notices
        run: npm run notices

      # With the signing key (version tags), every installer also gets a .sig for the in-app updater.
      # Without it (pull requests, local builds) the bundles are built unsigned as before.
      - name: Build bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          extra=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          npx tauri build --bundles ${{ matrix.bundles }} "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: rivalgui-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.sig

  # On a version tag (v1.2.3): publish a GitHub Release with every installer
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect installers, updater manifest and checksums
        run: |
          mkdir release
          find artifacts -type f \( -name '*.exe' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.sig' \) \
            -exec cp {} release/ \;
          node tools/updater-manifest.mjs "${GITHUB_REF_NAME#v}" release > latest.json
          mv latest.json release/
          cd release
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Write release notes
        run: node tools/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --title "RivalGUI ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
